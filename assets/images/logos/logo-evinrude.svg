<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="100%" height="100%">
  <!-- EVINRUDE Typography -->
  <g transform="skewX(-14) translate(30, 0)">
    <text x="0" y="56" font-family="'Outfit', 'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="52" fill="#1A1A1A" letter-spacing="-0.5">EVINRUDE</text>
  </g>

  <!-- Evinrude Iconic Dual Wing Chevron Symbol -->
