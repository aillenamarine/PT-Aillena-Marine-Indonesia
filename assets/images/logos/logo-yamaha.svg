<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="100%" height="100%">
  <!-- Yamaha Tuning Fork Emblem -->
  <g transform="translate(10, 5)">
    <!-- Outer metallic ring -->
    <circle cx="35" cy="35" r="34" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="35" cy="35" r="31.5" fill="url(#yamahaRedGrad)"/>
    
    <!-- Inner tuning forks (Silver) -->
    <!-- Center disc -->
    <circle cx="35" cy="35" r="5" fill="#E2E8F0"/>
    
    <!-- Top vertical fork -->
    <path d="M35 12 L32.5 17 L33.8 28 L31.5 29 L31.5 19 L30 19 L30 31 L33.8 33 L33.8 35 L36.2 35 L36.2 33 L40 31 L40 19 L38.5 19 L38.5 29 L36.2 28 L37.5 17 Z" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.6"/>
    
    <!-- Bottom Left fork (120 deg) -->
    <g transform="rotate(120 35 35)">
      <path d="M35 12 L32.5 17 L33.8 28 L31.5 29 L31.5 19 L30 19 L30 31 L33.8 33 L33.8 35 L36.2 35 L36.2 33 L40 31 L40 19 L38.5 19 L38.5 29 L36.2 28 L37.5 17 Z" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.6"/>
    </g>
    
    <!-- Bottom Right fork (240 deg) -->
    <g transform="rotate(240 35 35)">
      <path d="M35 12 L32.5 17 L33.8 28 L31.5 29 L31.5 19 L30 19 L30 31 L33.8 33 L33.8 35 L36.2 35 L36.2 33 L40 31 L40 19 L38.5 19 L38.5 29 L36.2 28 L37.5 17 Z" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.6"/>
    </g>
  </g>

  <!-- YAMAHA Typography -->
  <text x="92" y="55" font-family="'Outfit', 'Arial Black', Impact, sans-serif" font-weight="900" font-size="44" fill="#ED1C24" letter-spacing="1.5">YAMAHA</text>

  <defs>
    <radialGradient id="yamahaRedGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FF3838"/>
      <stop offset="70%" stop-color="#D90416"/>
      <stop offset="100%" stop-color="#A8000E"/>
    </radialGradient>
  </defs>
</svg>
